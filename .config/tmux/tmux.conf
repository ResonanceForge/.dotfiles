unbind C-b
set -g prefix M-p
set -g status-bg "color28"
set-window-option -g window-status-current-style "bg=color28,fg=color232 bold"    # current window background + foreground colors
# border colors
set -g pane-border-style        fg="colour28"
set -g pane-active-border-style fg="colour28"
# set -g mouse on
set -g clock-mode-color green
bind-key -T prefix M-j select-pane -D
bind-key -T prefix M-k select-pane -U
bind-key -T prefix M-h select-pane -L
bind-key -T prefix M-l select-pane -R
set -g status-keys emacs
set -g message-style fg="black",bg="green",fill="green"
